# Database connection comes from environment variables so no credentials live in git.
# Defaults point at a local PostgreSQL for development.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carolina}
spring.datasource.username=${DATABASE_USERNAME:carolina}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Hosting platforms (Render, Railway, Fly) assign the port through $PORT
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Set SQL_LOG_LEVEL=DEBUG locally to log out sql queries
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
